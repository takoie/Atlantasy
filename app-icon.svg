<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#38003c" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#02efad" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" stroke="#00ff87" stroke-width="8" stroke-opacity="0.3" />
  
  <!-- Trophy Graphic -->
  <g transform="translate(106, 96)" filter="url(#glow)">
    <!-- Base -->
    <rect x="75" y="270" width="150" height="24" rx="8" fill="url(#accent)" />
    <path d="M120 230 L180 230 L165 270 L135 270 Z" fill="url(#accent)" opacity="0.9" />
    
    <!-- Cup Body -->
    <path d="M60 40 L240 40 C240 160 210 230 150 230 C90 230 60 160 60 40 Z" fill="url(#accent)" />
    
    <!-- Handles -->
    <path d="M60 60 C10 60 10 140 65 150" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" />
    <path d="M240 60 C290 60 290 140 235 150" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Crown / Star on Trophy -->
    <circle cx="150" cy="115" r="28" fill="#38003c" />
    <path d="M150 95 L156 109 L171 111 L160 122 L163 137 L150 129 L137 137 L140 122 L129 111 L144 109 Z" fill="url(#accent)" />
  </g>
</svg>
